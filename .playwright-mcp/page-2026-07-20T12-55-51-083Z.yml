        - generic [ref=f1e159]:
          - heading "Processing Times" [level=2] [ref=f1e160]
          - paragraph [ref=f1e161]: Currently, we are experiencing a high volume of requests, which is causing delays in our response times for requests submitted by mail.
          - paragraph [ref=f1e162]: "If you have a TreasuryDirect account in your name, the processing times for specific transactions are as follows:"
          - list [ref=f1e163]:
            - listitem [ref=f1e164]:
              - strong [ref=f1e165]: "Unlocking Your Account or Updating Banking Information:"
              - text: Requests to unlock your TreasuryDirect account or update your banking details may take two weeks or longer to complete.
            - listitem [ref=f1e166]:
              - strong [ref=f1e167]: "Converting Paper Savings Bonds to Electronic Format:"
              - text: It may take nine months or longer to process requests to convert paper savings bonds into electronic bonds.
          - paragraph [ref=f1e168]:
            - strong [ref=f1e169]: "Searching for Lost, Stolen, or Missing Savings Bonds:"
            - text: Requests to locate lost, stolen, or missing savings bonds require eleven months or longer for processing.
          - paragraph [ref=f1e170]:
            - strong [ref=f1e171]: "Cashing Paper Savings Bonds:"
            - text: If you are named on the bonds and send them in with your request, processing may take three months or longer.
          - paragraph [ref=f1e172]:
            - strong [ref=f1e173]: "Other Paper Savings Bond Transactions (Not in Your Name):"
            - text: Transactions you are authorized to complete, but that are not in your name, require five months or longer to process.
          - paragraph [ref=f1e174]:
            - strong [ref=f1e175]: "Other TreasuryDirect Requests (Including Trusts):"
            - text: Requests related to trusts and other TreasuryDirect matters may take ten months or longer to process.
