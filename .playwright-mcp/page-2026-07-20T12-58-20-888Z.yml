          - listitem [ref=f11e115]:
            - text: To keep your account safe, only access TreasuryDirect through TreasuryDirect.gov. There are no Treasury approved apps or third-party websites for TreasuryDirect account access. When logging in, do not share your One-Time Passcode with anyone. Read about
            - link "Frauds, Phonies, and Scams" [ref=f11e116] [cursor=pointer]:
              - /url: https://treasurydirect.gov/laws-and-regulations/fraud/
