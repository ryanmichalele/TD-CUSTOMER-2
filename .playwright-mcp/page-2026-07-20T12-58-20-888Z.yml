    - generic [ref=f11e75]:
      - alert [ref=f11e76]:
        - generic [ref=f11e77]:
          - paragraph [ref=f11e78]:
            - strong [ref=f11e79]: Processing Times
          - paragraph [ref=f11e80]: Currently, we are experiencing a high volume of requests, which is causing delays in our response times for requests submitted by mail.
          - paragraph [ref=f11e81]: "If you have a TreasuryDirect account in your name, the processing times for specific transactions are as follows:"
          - list [ref=f11e82]:
            - listitem [ref=f11e83]:
              - strong [ref=f11e84]: "Unlocking Your Account or Updating Banking Information:"
              - text: Requests to unlock your TreasuryDirect account or update your banking details may take two weeks or longer to complete.
            - listitem [ref=f11e85]:
              - strong [ref=f11e86]: "Converting Paper Savings Bonds to Electronic Format:"
              - text: It may take nine months or longer to process requests to convert paper savings bonds into electronic bonds.
          - paragraph [ref=f11e87]:
            - strong [ref=f11e88]: "Searching for Lost, Stolen, or Missing Savings Bonds:"
            - text: Requests to locate lost, stolen, or missing savings bonds require eleven months or longer for processing.
          - paragraph [ref=f11e89]:
            - strong [ref=f11e90]: "Cashing Paper Savings Bonds:"
            - text: If you are named on the bonds and send them in with your request, processing may take three months or longer.
          - paragraph [ref=f11e91]:
            - strong [ref=f11e92]: "Other Paper Savings Bond Transactions (Not in Your Name):"
            - text: Transactions you are authorized to complete, but that are not in your name, require five months or longer to process.
          - paragraph [ref=f11e93]:
            - strong [ref=f11e94]: "Other TreasuryDirect Requests (Including Trusts):"
            - text: Requests related to trusts and other TreasuryDirect matters may take ten months or longer to process.
      - alert [ref=f11e95]:
        - paragraph [ref=f11e96]:
          - strong [ref=f11e97]: "TreasuryDirect customers:"
        - list [ref=f11e98]:
          - listitem [ref=f11e99]:
            - text: Our call center hours are Monday-Friday, 8am-6pm ET. You may reach us at
            - link "844-284-2676" [ref=f11e100] [cursor=pointer]:
              - /url: tel:+18442842676
            - text: .
          - listitem [ref=f11e101]:
            - text: If you open an account and are asked to send us an Account Authorization form, you must submit the
            - link "form" [ref=f11e102] [cursor=pointer]:
              - /url: /forms/acctauth.pdf
            - text: before you can access your account. Don't forget to have your
            - link "signature certified" [ref=f11e103] [cursor=pointer]:
              - /url: /research-center/signature-certification/
            - text: .
          - listitem [ref=f11e104]: You can make some bank changes online while logged in to your account. Click the ManageDirect tab and then "Update my Bank Information."
          - listitem [ref=f11e105]:
            - text: "Web help:"
